    <style>
        :root {
            --bg-page: #FBFBF9;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F4F4F0;
            --text-primary: #18181B;
            --text-secondary: #3F3F46;
            --text-muted: #71717A;
            --accent: #1E3A5F;
            --accent-light: rgba(30, 58, 95, 0.06);
            --border-hairline: #E4E4E0;
            --border-strong: #D4D4CE;
            --font-serif: 'Crimson Pro', 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', Georgia, serif;

            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            line-height: 1.75;
            background-color: var(--bg-page);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 64px 28px 80px;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-serif);
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 0;
        }

        /* ===== 双语切换控制逻辑 ===== */
        html.is-en .zh {
            display: none !important;
        }

        html.is-zh .en {
            display: none !important;
        }

        /* ===== 顶部导航栏 ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            margin-bottom: 56px;
            border-bottom: 1px solid var(--border-hairline);
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            font-family: var(--font-serif);
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.01em;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-strong);
            background-color: var(--bg-subtle);
            object-fit: cover;
            flex-shrink: 0;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.15s ease;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        .ctrl-btn {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-family: var(--font-sans);
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
            line-height: 1.4;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-secondary);
        }

        .lang-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background-color: var(--bg-subtle);
        }

        .vision-btn {
            background: var(--accent-light);
            border: 1px solid rgba(30, 58, 95, 0.25);
            color: var(--accent);
        }

        .vision-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ===== 主视觉区 ===== */
        .hero h1 {
            font-size: 2.35rem;
            line-height: 1.25;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        html.is-zh .hero h1 {
            font-size: 2.15rem;
            letter-spacing: 0.01em;
        }

        .hero .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            line-height: 1.65;
        }

        .hero .subtitle b {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== 个人研究陈述（去装饰化、典雅学术排版） ===== */
        .research-statement {
            margin: 28px 0 32px 0;
        }

        .statement-lead {
            font-size: 1.02rem;
            line-height: 1.85;
            color: var(--text-secondary);
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-left: 3px solid var(--accent);
            padding: 20px 24px;
            margin-bottom: 16px;
        }

        html.is-zh .statement-lead {
            text-align: justify;
        }

        .statement-lead strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .statement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .statement-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s ease;
        }

        .statement-card:hover {
            border-color: var(--border-strong);
        }

        .card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-hairline);
        }

        .card-tag {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
        }

        .card-index {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .statement-card h4 {
            margin: 0 0 10px 0;
            font-size: 1.12rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .statement-card p {
            margin: 0;
            font-size: 0.92rem;
            line-height: 1.75;
            color: var(--text-secondary);
            hyphens: auto;
        }

        html.is-zh .statement-card p {
            text-align: justify;
        }

            font-family: var(--font-serif);

            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
        }

            font-size: 0.85rem;
            color: var(--text-muted);

            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 3px;

            color: var(--accent);
            border: 1px solid rgba(30, 58, 95, 0.2);

        }

        .action-links a:hover {

            border-color: var(--accent);
            background-color: var(--accent-light);
        }

        }

            color: var(--text-primary);
            font-weight: 500;
        }

            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            margin-left: 12px;
        }
